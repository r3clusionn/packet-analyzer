[package]
name = "pktscope"
version = "0.1.0"
edition = "2021"
description = "A packet analyzer for pcap and pcapng files: Ethernet, ARP, IPv4, IPv6, ICMP, TCP, UDP, DNS, HTTP and TLS, with filters, statistics and TCP stream reassembly."
license = "MIT"

[lib]
name = "pktscope"

[[bin]]
name = "pks"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
debug = false
